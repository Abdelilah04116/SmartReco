services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-reco-backend
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-demo-api-key-change-in-production}
      - DEBUG=${DEBUG:-false}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./rules_config.yaml:/app/rules_config.yaml:ro
      - ./data:/app/data:rw
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - smart-reco-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: smart-reco-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smart-reco-network

networks:
  smart-reco-network:
    driver: bridge

volumes:
  logs:
  data:

